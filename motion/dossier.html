<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070404; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Style "dossier" : fond noir + lueur rouge, icones et chiffres en matrice de points (pixel art LED),
   titres blancs avec mots-cles rouges, tampons inclines, compteurs d'icones. Coupes seches, flash rouge
   sur les moments forts. Tout est une fonction pure du temps t (rendu image par image deterministe). */
const DATA = /*DATA*/null;
const RED = "#e5231b", RED_D = "#7a0d0a", WHITE = "#f4efee", MUTED = "#8c7f7d";
const TITLE_FONT = '"Archivo Black", "Montserrat Black", "Arial Black", "Segoe UI Black", sans-serif';
const EMOJI_FONT = '"Noto Color Emoji", "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
const LED_FONT = '"Montserrat Black", "Arial Black", "Segoe UI Black", sans-serif';

const cv = document.getElementById("c"), cx = cv.getContext("2d");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = p => 1 - Math.pow(1 - p, 3);
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; }

// ---------- matrice de points ----------
const cache = new Map();
function dotify(kind, content, size) {
  // rend un emoji ou un texte sur un petit canvas puis l'echantillonne en grille : [{x,y,v,r}] (v = intensite)
  const key = kind + "|" + content + "|" + size;
  if (cache.has(key)) return cache.get(key);
  const off = document.createElement("canvas"), o = off.getContext("2d", { willReadFrequently: true });
  let w, h, step;
  if (kind === "icon") {
    w = h = 128; off.width = w; off.height = h; step = 3;
    o.font = `104px ${EMOJI_FONT}`; o.textAlign = "center"; o.textBaseline = "middle"; o.fillText(content, 64, 70);
  } else {
    o.font = `${size}px ${LED_FONT}`;
    w = Math.ceil(o.measureText(content).width) + 8; h = Math.ceil(size * 1.15);
    off.width = w; off.height = h; o.font = `${size}px ${LED_FONT}`; o.textBaseline = "middle"; o.fillStyle = "#fff";
    o.fillText(content, 4, h / 2 + size * 0.04); step = Math.max(2, Math.round(size / 15));   // ~15 points de haut : "1", "," et "6/9" restent lisibles
  }
  const img = o.getImageData(0, 0, w, h).data, dots = [];
  for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) {
    let a = 0, l = 0, n = 0;
    for (let yy = y; yy < Math.min(h, y + step); yy++) for (let xx = x; xx < Math.min(w, x + step); xx++) {
      const i = (yy * w + xx) * 4; a += img[i + 3]; l += (img[i] * .3 + img[i + 1] * .59 + img[i + 2] * .11) * img[i + 3] / 255; n++;
    }
    a /= n * 255; l /= n * 255;
    if (a > 0.35) dots.push({ x: x / w, y: y / h, v: kind === "icon" ? 0.35 + 0.65 * l : 1, r: hash(dots.length * 7919 + x * 31 + y) });
  }
  const res = { dots, cols: Math.ceil(w / step), rows: Math.ceil(h / step), aspect: w / h };
  cache.set(key, res); return res;
}

function drawDots(d, cxp, cyp, width, t0, t, opt = {}) {
  // dessine une matrice centree en (cxp, cyp) ; apparition progressive (balayage du bas vers le haut + aleatoire)
  const height = width / d.aspect, cell = width / d.cols, rad = cell * 0.42, reveal = opt.reveal || 0.45;
  for (const p of d.dots) {
    const order = opt.sweep === "left" ? p.x : 1 - p.y;
    const appear = t0 + (order * 0.65 + p.r * 0.35) * reveal;
    if (t < appear) continue;
    const fresh = clamp((t - appear) / 0.08);
    const shimmer = 0.85 + 0.15 * Math.sin(t * 6 + p.r * 40);
    const v = p.v * shimmer;
    cx.fillStyle = opt.color || (v > 0.72 ? RED : v > 0.5 ? "#b8180f" : RED_D);
    if (opt.color) cx.globalAlpha = v;
    const x = cxp - width / 2 + p.x * width, y = cyp - height / 2 + p.y * height;
    cx.fillRect(x - rad * fresh, y - rad * fresh, rad * 2 * fresh, rad * 2 * fresh);
    cx.globalAlpha = 1;
  }
  return height;
}

// ---------- texte titre (mots *rouges*) ----------
function wrapTitle(text, font, maxW) {
  cx.font = font;
  // *mot* ou *plusieurs mots* -> en rouge
  const toks = [];
  let inRed = false;
  // ponctuation francaise (" ?", " !", " :") collee au mot precedent : jamais seule en debut de ligne
  for (const w of text.replace(/\s+([?!:;»])/g, "\u00a0$1").split(/[ \t\n]+/).filter(Boolean)) { const starts = w.startsWith("*"), ends = /\*[.,!?…:;»"]*$/.test(w);
    if (starts) inRed = true; toks.push({ w: w.replace(/\*/g, ""), red: inRed }); if (ends) inRed = false; }
  const lines = [[]]; let lw = 0;
  for (const tk of toks) { const ww = cx.measureText(tk.w + " ").width;
    if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(tk); lw += ww; }
  return lines;
}
function drawTitle(text, y, size, t0, t, align = "center") {
  const font = `${size}px ${TITLE_FONT}`, lines = wrapTitle(text, font, size > 90 ? 960 : 900);
  const a = easeOut(clamp((t - t0) / 0.18));
  cx.font = font; cx.textBaseline = "top"; cx.globalAlpha = a;
  lines.forEach((ln, i) => {
    const full = ln.map(tk => tk.w).join(" "), W = cx.measureText(full).width;
    let x = 540 - W / 2, yy = y + i * size * 1.12 + (1 - a) * 18;
    for (const tk of ln) { cx.fillStyle = tk.red ? RED : WHITE; cx.fillText(tk.w, x, yy); x += cx.measureText(tk.w + " ").width; }
  });
  cx.globalAlpha = 1;
  return lines.length * size * 1.12;
}

function drawStamp(text, x, y, t0, t) {
  const p = clamp((t - t0) / 0.14); if (p <= 0) return;
  const s = 1.7 - 0.7 * easeOut(p);
  cx.save(); cx.translate(x, y); cx.rotate(-0.07); cx.scale(s, s); cx.globalAlpha = Math.min(1, p * 1.5);
  const d = dotify("led", text.toUpperCase(), 40), w = Math.min(720, d.aspect * 46), h = w / d.aspect;
  // fond sombre : le tampon reste lisible meme pose sur une icone rouge
  cx.fillStyle = "rgba(7,4,4,.92)"; cx.fillRect(-w / 2 - 22, -h / 2 - 16, w + 44, h + 32);
  cx.strokeStyle = RED; cx.lineWidth = 5; cx.strokeRect(-w / 2 - 22, -h / 2 - 16, w + 44, h + 32);
  drawDots(d, 0, 0, w, -9, 9, { reveal: 0.01 });
  cx.restore(); cx.globalAlpha = 1;
}

function drawArray(icon, n, top, t0, t1, t) {
  // n petites icones en grille, qui se remplissent au fil du temps (ex. 34 danseurs)
  const cols = n <= 12 ? 4 : n <= 40 ? 7 : 10, size = n <= 12 ? 150 : n <= 40 ? 104 : 78, gap = size * 1.15;
  const rows = Math.ceil(n / cols), x0 = 540 - (Math.min(n, cols) - 1) * gap / 2;
  const d = dotify("icon", icon, 0), k = Math.floor(clamp((t - t0) / Math.max(0.3, (t1 - t0) * 0.8)) * n);
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols, x = x0 + c * gap, y = top + r * gap;
    if (i < k) drawDots(d, x, y, size, -9, 9, { reveal: 0.01 });
    else { cx.fillStyle = "rgba(255,255,255,.06)"; cx.fillRect(x - size * .35, y - size * .35, size * .7, size * .7); }
  }
  return rows * gap;
}

// ---------- fond ----------
function drawBg(t, beat) {
  cx.fillStyle = "#070404"; cx.fillRect(0, 0, 1080, 1920);
  const pulse = 0.85 + 0.15 * Math.sin(t * 1.4);
  const g = cx.createRadialGradient(540, 760, 40, 540, 760, 900);
  g.addColorStop(0, `rgba(110,12,10,${0.42 * pulse})`); g.addColorStop(0.55, "rgba(40,4,4,.25)"); g.addColorStop(1, "rgba(0,0,0,0)");
  cx.fillStyle = g; cx.fillRect(0, 0, 1080, 1920);
  // trame de points tres discrete
  cx.fillStyle = "rgba(255,255,255,.025)";
  for (let y = 12; y < 1920; y += 24) for (let x = 12; x < 1080; x += 24) cx.fillRect(x, y, 2, 2);
  // grain anime
  const f = Math.floor(t * 30);
  for (let i = 0; i < 900; i++) { const x = hash(f * 1000 + i) * 1080, y = hash(f * 2000 + i * 3) * 1920;
    cx.fillStyle = `rgba(255,255,255,${0.03 + 0.05 * hash(i + f)})`; cx.fillRect(x, y, 2, 2); }
  const v = cx.createRadialGradient(540, 900, 600, 540, 900, 1300);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.7)"); cx.fillStyle = v; cx.fillRect(0, 0, 1080, 1920);
}

// ---------- scene ----------
function drawBeat(b, t) {
  const t0 = b.start, lt = t - t0;
  let y = b.led && !b.title && !b.icon && !b.array ? 520 : 170;   // chiffre/mot LED seul : centre
  const textOnly = b.title && !b.led && !b.icon && !b.array && !b.stamp;
  // Accroche (1er beat) : tout est visible des l'image 0, sans fondu ni apparition point par point.
  // Analyse retention du 22/10/2026 : 30 a 70 % des spectateurs partaient avant 3 s, ecran quasi vide au debut.
  const instant = t0 === 0;
  // 2e beat aussi sans apparition progressive : analyse du 24/10/2026, 1/3 des spectateurs partait entre 1 s et 3 s
  const fast = instant || b === DATA.beats[1];
  if (textOnly) {   // phrase seule : en gros, au centre de la zone visible (comme "Normal." / "MAIS ATTENDEZ.")
    const size = b.title.length > 30 ? 92 : 118;
    const punch = instant ? 1.06 - 0.06 * clamp(lt / Math.max(1, b.end - t0))   // leger zoom arriere continu : l'image bouge des le debut
                          : 1 + 0.08 * (1 - easeOut(clamp((t - t0) / 0.2)));
    cx.save(); cx.translate(540, 700); cx.scale(punch, punch); cx.translate(-540, -700);
    const th = drawTitle(b.title, 640, size, fast ? t0 - 1 : t0, t); cx.restore();
    if (b.sub) { cx.font = `${instant ? 48 : 40}px ${TITLE_FONT}`; cx.textAlign = "center"; cx.textBaseline = "top";
      cx.globalAlpha = fast ? 1 : clamp((lt - 0.3) / 0.25);
      cx.fillStyle = instant ? RED : MUTED; cx.fillText(b.sub, 540, Math.max(instant ? 1010 : 960, 640 + th * 1.06 + 40)); cx.globalAlpha = 1; cx.textAlign = "start"; }
    return;
  }
  if (b.title) y += drawTitle(b.title, y, b.title.length > 42 ? 58 : 70, fast ? t0 - 1 : t0, t) + 40;
  if (b.led) {
    const d = dotify("led", b.led, 90), w = Math.min(940, d.aspect * 190), h = w / d.aspect;
    const ledT = fast ? t0 : t0 + (b.title ? 0.12 : 0);
    if (t >= ledT) drawDots(d, 540, y + h / 2, w, ledT, t, { reveal: fast ? 0.001 : 0.32, sweep: "left" });
    if (b.strike && t > t0 + b.strike) { const q = easeOut(clamp((t - t0 - b.strike) / 0.25));
      cx.fillStyle = WHITE; cx.fillRect(540 - w / 2 - 20, y + h / 2 - 6, (w + 40) * q, 12); }
    y += h + 26;
    if (b.led_sub) { cx.font = `34px ${TITLE_FONT}`; cx.textAlign = "center"; cx.textBaseline = "top";
      cx.globalAlpha = fast ? 1 : clamp((t - ledT - 0.25) / 0.2); cx.fillStyle = MUTED; cx.fillText(b.led_sub.toUpperCase(), 540, y);
      cx.globalAlpha = 1; cx.textAlign = "start"; y += 70; }
  }
  if (b.icon) {
    const size = b.led ? 420 : 560, fl = Math.sin(lt * 2.2) * 6;
    drawDots(dotify("icon", b.icon, 0), 540, y + size / 2 + 20 + fl, size, fast ? t0 : t0 + 0.05, t, { reveal: fast ? 0.001 : 0.55 });
    if (b.stamp) drawStamp(b.stamp, 540 + 150, y + 80, t0 + (b.stamp_at ?? Math.min(1.0, (b.end - t0) * 0.5)), t);
    y += size + 60;
  } else if (b.stamp) { drawStamp(b.stamp, 540, y + 90, t0 + (b.stamp_at ?? 0.25), t); y += 200; }
  if (b.array) drawArray(b.array.icon, b.array.n, y + 60, t0 + 0.1, b.end, t);
  if (b.sub) { cx.font = `40px ${TITLE_FONT}`; cx.textAlign = "center"; cx.textBaseline = "top"; cx.globalAlpha = fast ? 1 : clamp((lt - 0.3) / 0.25);
    cx.fillStyle = MUTED; cx.fillText(b.sub, 540, Math.max(y, 1180)); cx.globalAlpha = 1; cx.textAlign = "start"; }
}

// ---------- sous-titres mot par mot (karaoke) ----------
// 25/10/2026 : demande utilisateur "meilleure accroche visuelle et auditive" -> on lit en meme temps qu'on ecoute,
// et la video reste comprehensible sans le son. Groupes de 2 a 4 mots, mot prononce en rouge et grossi.
let CHUNKS = null;
function chunks() {
  if (CHUNKS) return CHUNKS;
  CHUNKS = [];
  let cur = [];
  const ws = DATA.words || [];
  ws.forEach((w, i) => {
    cur.push(w);
    // fin de groupe : ponctuation, pause de la voix (les timings Azure n'ont pas toujours la ponctuation) ou 4 mots
    const pause = ws[i + 1] ? ws[i + 1].t - w.e > 0.22 : true;
    const chars = cur.reduce((n, x) => n + x.w.length + 1, 0), next = ws[i + 1] ? ws[i + 1].w.length : 0;
    if (/[.!?…,:;]$/.test(w.w) || pause || cur.length >= 4 || chars + next > 19) { CHUNKS.push(cur); cur = []; }
  });
  if (cur.length) CHUNKS.push(cur);
  return CHUNKS;
}
function drawCaption(t) {
  const cs = chunks(); if (!cs.length) return;
  let c = null;
  for (const k of cs) if (t >= k[0].t - 0.05) c = k;
  if (!c || t > c[c.length - 1].e + 0.35) return;
  const size = 66, font = `${size}px ${TITLE_FONT}`;
  cx.font = font; cx.textBaseline = "middle"; cx.lineJoin = "round";
  const words = c.map(w => w.w.toUpperCase()), widths = words.map(w => cx.measureText(w).width * 1.1 + 24);   // marge : le mot prononce est agrandi
  const total = widths.reduce((a, b) => a + b, 0);
  const fit = Math.min(1, 960 / total);   // groupe trop large : on reduit tout le groupe plutot que de deborder
  let x = 540 - total * fit / 2;
  const y = 1350, pop = easeOut(clamp((t - c[0].t + 0.05) / 0.12));
  words.forEach((w, i) => {
    const on = t >= c[i].t && t < (c[i + 1] ? c[i + 1].t : c[i].e + 0.3);
    const s = on ? 1.08 : 1;
    cx.save(); cx.translate(x + widths[i] * fit / 2, y); cx.scale(s * fit * (0.85 + 0.15 * pop), s * fit * (0.85 + 0.15 * pop));
    cx.textAlign = "center"; cx.lineWidth = 14; cx.strokeStyle = "rgba(0,0,0,.9)"; cx.strokeText(w, 0, 0);
    cx.fillStyle = on ? RED : WHITE; cx.fillText(w, 0, 0);
    cx.restore(); x += widths[i] * fit;
  });
  cx.textAlign = "start";
}

function render(t) {
  const beats = DATA.beats;
  let b = beats[0];
  for (const x of beats) if (t >= x.start) b = x;
  drawBg(t, b);
  // Accroche : "slam" a l'ouverture (zoom arriere rapide + secousse) cale sur l'impact sonore ; l'image 0 reste nette
  // (vignette du profil). Puis petit a-coup a chaque changement de plan, secousse sur les retournements.
  let zoom = 1, sx = 0, sy = 0;
  if (t >= 0.04 && t < 0.5) { const p = (t - 0.04) / 0.46; zoom = 1 + 0.16 * Math.pow(1 - p, 3);
    const a = 22 * Math.pow(1 - p, 2); sx = (hash(Math.floor(t * 60)) - .5) * a; sy = (hash(Math.floor(t * 60) + 99) - .5) * a; }
  if (b.start > 0 && t - b.start < 0.14) zoom *= 1 + 0.045 * (1 - (t - b.start) / 0.14);
  if (b.flash && b.start > 0 && t - b.start < 0.3) { const a = 16 * Math.pow(1 - (t - b.start) / 0.3, 2);
    sx += (hash(Math.floor(t * 60) + 7) - .5) * a; sy += (hash(Math.floor(t * 60) + 13) - .5) * a; }
  cx.save(); cx.translate(540 + sx, 860 + sy); cx.scale(zoom, zoom); cx.translate(-540, -860);
  drawBeat(b, t);
  cx.restore();
  drawCaption(t);
  // eclair blanc puis rouge sur l'impact d'ouverture (images 2 a 5)
  if (t >= 0.04 && t < 0.17) { cx.fillStyle = t < 0.08 ? "rgba(255,255,255,.35)" : "rgba(229,35,27,.28)"; cx.fillRect(0, 0, 1080, 1920); }
  // flash rouge sur les temps forts (2 images)
  for (const x of beats) if (x.flash && x.start > 0 && t >= x.start && t < x.start + 0.07) { cx.fillStyle = "rgba(229,35,27,.55)"; cx.fillRect(0, 0, 1080, 1920); }
  // petit indicateur de progression facon "dossier"
  cx.fillStyle = "rgba(255,255,255,.12)"; cx.fillRect(90, 1640, 900, 4);
  cx.fillStyle = RED; cx.fillRect(90, 1640, 900 * clamp(t / DATA.duration), 4);
  // numero de serie, toujours visible en haut : donne une raison de suivre le compte ("Dossier n°12")
  if (DATA.num) { cx.font = `34px ${TITLE_FONT}`; cx.textAlign = "center"; cx.textBaseline = "top"; cx.fillStyle = RED;
    cx.fillText(`DOSSIER N°${DATA.num}`, 540, 96); cx.textAlign = "start"; }
}
window.render = render;
document.fonts.ready.then(() => { window.ready = true; });
</script>
</body>
</html>
