name: Demo chaine FR (style dossier)

# Rend la video de demo "epidemie dansante de 1518" avec les vraies voix Azure francaises (les cles ne sont
# disponibles que dans les secrets GitHub) et recommite les .mp4 dans demo_out/ sur la branche demo-fr.
on:
  push:
    branches: [demo-fr]
    paths: ["demo_fr.py", "dossier_video.py", "motion/dossier.html", ".github/workflows/demo-fr.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji fonts-montserrat || true
          fc-cache -f

      - name: Rendu avec la voix Remy (naturelle)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TTS_VOICE: fr-FR-RemyMultilingualNeural
          TTS_RATE: "+6%"
        run: python demo_fr.py demo_out

      - name: Rendu avec la voix Henri (documentaire)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TTS_VOICE: fr-FR-HenriNeural
          TTS_RATE: "+8%"
        run: python demo_fr.py demo_out

      - name: Renvoyer les videos dans le depot
        run: |
          rm -rf demo_out/_work_*
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demo_out/*.mp4
          git commit -m "demo: videos rendues avec les voix Azure FR [skip ci]"
          git push
