name: Daily YouTube videos

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Type de video a generer"
        type: choice
        options: [short, long]
        default: short
      publish:
        description: "Publier sur YouTube (decoche pour un run de test)"
        type: boolean
        default: false
  schedule:
    # Un cron GitHub Actions est fixe en UTC et ne suit PAS le changement d'heure ete/hiver. Plutot
    # que de figer un horaire UTC qui deriverait d'1h a chaque bascule, on declare DEUX jeux de cron
    # couvrant les 5 horaires locaux Paris (8,12,16,19,21h - creneaux d'engagement generalement les
    # plus efficaces : reveil/trajet, pause dejeuner, fin de journee, prime time soir) : un en
    # supposant l'heure d'hiver (UTC+1) et un en supposant l'heure d'ete (UTC+2). A chaque
    # declenchement, le step "Determiner le type de run" recalcule l'heure locale Paris REELLE au
    # moment du run et decide quoi faire - celui des deux jeux qui ne correspond pas a la saison en
    # cours se resout juste en "skip" (quelques secondes, aucun cout sur un repo public). Plus jamais
    # besoin de toucher ces lignes a la main.
    - cron: "0 7,11,15,18,20 * * *"  # hypothese heure d'hiver (UTC+1)
    - cron: "0 6,10,14,17,19 * * *"  # hypothese heure d'ete (UTC+2)

permissions:
  contents: write

# GitHub ne rattrape jamais un cron manque (contrairement au Planificateur de taches Windows) : si le
# runner est indisponible au moment prevu, ce declenchement est simplement saute, pas mis en file
# d'attente pour plus tard. Ce concurrency group empeche seulement un chevauchement improbable entre
# deux declenchements presque simultanes (ex: un run manuel de test pendant un cron).
concurrency:
  group: youtube-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Determiner le type de run (long/short/skip) et si on publie
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_type=${{ inputs.run_type }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ=Europe/Paris date +%H)
            echo "Heure locale Paris actuelle : ${hour}h"
            if [ "$hour" = "19" ]; then
              echo "run_type=long" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            elif [[ "$hour" =~ ^(08|12|16|21)$ ]]; then
              echo "run_type=short" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Heure ${hour}h hors des creneaux prevus (probablement l'hypothese ete/hiver qui ne s'applique pas aujourd'hui) - rien a faire."
              echo "run_type=skip" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.run_type != 'skip'
        with:
          python-version: "3.12"

      - name: Installer les dependances Python
        if: steps.pick.outputs.run_type != 'skip'
        run: pip install -r requirements.txt

      - name: Installer une police de secours pour les sous-titres/miniatures (Arial Black/Impact n'existent pas sur Linux)
        if: steps.pick.outputs.run_type != 'skip'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          fc-cache -f

      # Place AVANT l'installation d'Ollama : si le cache existe deja, "ollama pull" plus bas
      # detectera les blobs deja presents et ne retelechargera que ce qui manque (au lieu de
      # retelecharger le modele ~2 Go a chaque run).
      - name: Restaurer le cache du modele Ollama
        if: steps.pick.outputs.run_type != 'skip'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-llama3.2-3b

      - name: Installer et demarrer Ollama, telecharger le modele
        if: steps.pick.outputs.run_type != 'skip'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama_serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/ >/dev/null && break
            sleep 1
          done
          ollama pull llama3.2:3b

      - name: Preparer les secrets YouTube/Pexels
        if: steps.pick.outputs.run_type != 'skip'
        env:
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET_B64" | base64 -d > client_secret.json
          echo "$YOUTUBE_TOKEN_B64" | base64 -d > token.json

      # edge-tts (voix off) echoue de temps en temps avec "NoAudioReceived" - probleme flaky cote
      # backend Microsoft, deja rencontre sur le PC (voir run_pipeline_safe.ps1, meme logique de
      # retry ci-dessous : 3 tentatives, pause 60s entre chaque).
      - name: Lancer le pipeline (video longue)
        if: steps.pick.outputs.run_type == 'long'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUBTITLE_FONT_NAME: "DejaVu Sans"
          PUBLISHED_DIR: ${{ runner.temp }}/published
        run: |
          ARGS="--publish"
          if [ "${{ steps.pick.outputs.publish }}" != "true" ]; then ARGS=""; fi
          for attempt in 1 2 3; do
            python run_pipeline.py $ARGS && break
            echo "Echec tentative $attempt/3"
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 60
          done

      - name: Lancer le pipeline (short)
        if: steps.pick.outputs.run_type == 'short'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUBTITLE_FONT_NAME: "DejaVu Sans"
          PUBLISHED_DIR: ${{ runner.temp }}/published
        run: |
          ARGS="--publish"
          if [ "${{ steps.pick.outputs.publish }}" != "true" ]; then ARGS=""; fi
          for attempt in 1 2 3; do
            python run_shorts_pipeline.py $ARGS && break
            echo "Echec tentative $attempt/3"
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 60
          done

      - name: Sauvegarder l'historique des sujets/titres (evite les repetitions entre deux runs)
        if: always()
        run: |
          rm -f client_secret.json token.json
          if git diff --quiet -- output/used_topics.json output/used_titles.json; then
            echo "Rien de nouveau a committer."
            exit 0
          fi
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/used_topics.json output/used_titles.json
          git commit -m "chore: mise a jour historique sujets/titres [skip ci]"
          git push
