name: Daily YouTube videos

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Type de video a generer"
        type: choice
        options: [short, long]
        default: short
      publish:
        description: "Publier sur YouTube (decoche pour un run de test)"
        type: boolean
        default: false
  # 2 Shorts (8h et 13h) + 1 longue (19h) par jour, heure de Paris.
  # 22/11/2026 : les cron GitHub de ce depot tombent avec 2 a 15h de retard (voire pas du tout), si bien que
  # l'ancien systeme "publier quand le cron tombe" ne sortait qu'UN Short par jour vers 15h30 (le 8h
  # n'arrivait jamais). Desormais un cron horaire (minute :17, hors pic de debut d'heure) appelle
  # slot_planner.py, qui prepare la video du prochain creneau non couvert et l'envoie a YouTube avec une
  # mise en ligne programmee (publishAt) : YouTube la publie pile a l'heure, quel que soit le retard du
  # cron. Heure d'ete/hiver geree en Python (Europe/Paris). Un run sans rien a faire dure ~10s.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

# GitHub ne rattrape jamais un cron manque (contrairement au Planificateur de taches Windows) : si le
# runner est indisponible au moment prevu, ce declenchement est simplement saute, pas mis en file
# d'attente pour plus tard. Ce concurrency group empeche seulement un chevauchement improbable entre
# deux declenchements presque simultanes (ex: un run manuel de test pendant un cron).
concurrency:
  group: youtube-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Determiner le type de run (long/short/skip) et si on publie
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_type=${{ inputs.run_type }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "publish_at=" >> "$GITHUB_OUTPUT"
          else
            # Ecrit run_type / slot / publish_at (voir slot_planner.py, stdlib uniquement).
            python3 slot_planner.py pick
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.run_type != 'skip'
        with:
          python-version: "3.12"

      - name: Installer les dependances Python
        if: steps.pick.outputs.run_type != 'skip'
        run: pip install -r requirements.txt

      - name: Installer une police de secours pour les sous-titres/miniatures (Arial Black/Impact n'existent pas sur Linux)
        if: steps.pick.outputs.run_type != 'skip'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          # Police grasse "affiche" pour l'accroche et les sous-titres animes des Shorts (montage.py).
          # "|| true" : si le paquet manque, libass retombe sur DejaVu, le run ne doit jamais casser pour ca.
          sudo apt-get install -y fonts-montserrat || true
          # Emoji en couleur pour les scenes "emoji" du montage Motion (motion/engine.html).
          sudo apt-get install -y fonts-noto-color-emoji || true
          fc-cache -f

      - name: Installer Chromium pour le montage Motion des Shorts (rendu image par image via Playwright)
        if: steps.pick.outputs.run_type != 'skip'
        # Sans Chromium, run_shorts_pipeline.py retombe sur le montage clips stock : on ne bloque pas le run.
        run: python -m playwright install --with-deps chromium || echo "::warning::Chromium indisponible, repli sur le montage clips stock"

      # Place AVANT l'installation d'Ollama : si le cache existe deja, "ollama pull" plus bas
      # detectera les blobs deja presents et ne retelechargera que ce qui manque (au lieu de
      # retelecharger le modele ~2 Go a chaque run).
      - name: Restaurer le cache du modele Ollama
        if: steps.pick.outputs.run_type != 'skip'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-llama3.2-3b

      - name: Installer et demarrer Ollama, telecharger le modele
        if: steps.pick.outputs.run_type != 'skip'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama_serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/ >/dev/null && break
            sleep 1
          done
          ollama pull llama3.2:3b

      - name: Preparer les secrets YouTube/Pexels
        if: steps.pick.outputs.run_type != 'skip'
        env:
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET_B64" | base64 -d > client_secret.json
          echo "$YOUTUBE_TOKEN_B64" | base64 -d > token.json

      # Retry generique (3 tentatives, pause 60s) : garde-fou contre tout alea reseau/API transitoire
      # (Ollama, Pexels, Azure Speech...), pas specifique a un service en particulier.
      - name: Lancer le pipeline (video longue)
        if: steps.pick.outputs.run_type == 'long'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          SUBTITLE_FONT_NAME: "DejaVu Sans"
          SHORTS_FONT_NAME: "Montserrat Black"
          PUBLISHED_DIR: ${{ runner.temp }}/published
          PUBLISH_AT: ${{ steps.pick.outputs.publish_at }}
        run: |
          ARGS="--publish"
          if [ -n "$PUBLISH_AT" ]; then ARGS="--publish --publish-at $PUBLISH_AT"; fi
          if [ "${{ steps.pick.outputs.publish }}" != "true" ]; then ARGS=""; fi
          for attempt in 1 2 3; do
            python run_pipeline.py $ARGS && break
            echo "Echec tentative $attempt/3"
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 60
          done

      - name: Lancer le pipeline (short)
        if: steps.pick.outputs.run_type == 'short'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          SUBTITLE_FONT_NAME: "DejaVu Sans"
          SHORTS_FONT_NAME: "Montserrat Black"
          PUBLISHED_DIR: ${{ runner.temp }}/published
          PUBLISH_AT: ${{ steps.pick.outputs.publish_at }}
        run: |
          ARGS="--publish"
          if [ -n "$PUBLISH_AT" ]; then ARGS="--publish --publish-at $PUBLISH_AT"; fi
          if [ "${{ steps.pick.outputs.publish }}" != "true" ]; then ARGS=""; fi
          for attempt in 1 2 3; do
            python run_shorts_pipeline.py $ARGS && break
            echo "Echec tentative $attempt/3"
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 60
          done

      # Seulement apres un upload reussi : un creneau en echec sera retente au prochain cron horaire
      # (tant qu'il n'a pas plus de 4h de retard).
      - name: Marquer le creneau comme couvert
        if: success() && steps.pick.outputs.slot != ''
        run: python3 slot_planner.py done "${{ steps.pick.outputs.slot }}"

      - name: Sauvegarder l'historique des sujets/titres (evite les repetitions entre deux runs)
        if: always()
        run: |
          rm -f client_secret.json token.json
          git add -- output/used_topics.json output/used_titles.json output/priority_topics.json
          [ -f output/scheduled_slots.json ] && git add -- output/scheduled_slots.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau a committer."
            exit 0
          fi
          git config user.name "youtube-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: mise a jour historique sujets/titres [skip ci]"
          git push
